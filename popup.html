<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雨课堂课件导出器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="app-icon" aria-hidden="true">
          <img src="icons/icon-32.png" alt="" />
        </div>
        <div class="app-title">
          <h1>课件导出器</h1>
          <p id="platform-name">雨课堂</p>
        </div>
        <div id="connection-status" class="connection-status" data-state="checking">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connection-text">检查中</span>
        </div>
      </header>

      <section id="compatibility-warning" class="compatibility-warning hidden" role="note">
        本插件基于“长江”雨课堂开发，不保证在当前雨课堂能正常使用！
      </section>

      <section id="notice" class="notice" role="status" aria-live="polite">
        正在检查当前页面…
      </section>

      <section id="course-panel" class="course-panel hidden" aria-labelledby="course-heading">
        <div class="course-tools">
          <label class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16 16 4 4" />
            </svg>
            <input id="course-search" type="search" placeholder="搜索课程" autocomplete="off" />
          </label>
          <button id="scan" class="icon-button" type="button" title="重新读取课程" aria-label="重新读取课程">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 8a7 7 0 1 0 .3 7" />
              <path d="M19 4v4h-4" />
            </svg>
          </button>
        </div>

        <div class="list-heading">
          <div>
            <span id="course-heading">课程</span>
            <span id="course-total" class="muted-count"></span>
          </div>
          <div class="selection-actions">
            <button id="select-all" class="text-button" type="button" disabled>全选</button>
            <span aria-hidden="true">·</span>
            <button id="select-none" class="text-button" type="button" disabled>清空</button>
          </div>
        </div>

        <div id="course-list" class="course-list"></div>
        <div id="no-results" class="empty-state hidden">没有找到匹配的课程</div>
      </section>

      <section id="lesson-panel" class="lesson-panel hidden" aria-labelledby="lesson-heading">
        <div class="date-range" role="group" aria-label="课件日期范围">
          <label class="date-field">
            <span>起始</span>
            <input id="date-from" type="date" />
          </label>
          <span class="date-separator" aria-hidden="true">–</span>
          <label class="date-field">
            <span>结束</span>
            <input id="date-to" type="date" />
          </label>
          <button id="date-reset" class="text-button" type="button">不限</button>
        </div>

        <div class="export-options">
          <div class="directory-row">
            <div class="directory-copy">
              <strong>导出目录</strong>
              <span id="directory-name">尚未选择课件文件夹</span>
            </div>
            <button id="choose-directory" class="small-button" type="button">选择目录</button>
          </div>
          <fieldset class="duplicate-modes">
            <legend>重复处理</legend>
            <label>
              <input type="radio" name="duplicate-mode" value="tolerant" checked />
              <span><strong>宽容模式</strong><small>同名文件存在时直接跳过</small></span>
            </label>
            <label>
              <input type="radio" name="duplicate-mode" value="strict" />
              <span><strong>严格模式</strong><small>生成后按文件大小判断重复</small></span>
            </label>
          </fieldset>
        </div>

        <p id="lesson-scope" class="lesson-scope"></p>

        <div id="lesson-list-heading" class="list-heading">
          <div>
            <span id="lesson-heading">课件</span>
            <span id="lesson-total" class="muted-count"></span>
          </div>
          <div id="lesson-selection-actions" class="selection-actions">
            <button id="lesson-select-all" class="text-button" type="button">全选</button>
            <span aria-hidden="true">·</span>
            <button id="lesson-select-none" class="text-button" type="button">清空</button>
          </div>
        </div>

        <div id="lesson-list" class="course-list"></div>
        <div id="lesson-empty" class="empty-state hidden">当前日期范围内没有课件</div>
      </section>

      <section id="loading-panel" class="loading-panel">
        <div class="loading-row"><span></span><span></span></div>
        <div class="loading-row"><span></span><span></span></div>
        <div class="loading-row"><span></span><span></span></div>
      </section>

      <section id="progress-panel" class="progress-panel hidden" aria-live="polite">
        <div class="progress-heading">
          <strong id="progress-label">准备中</strong>
          <span id="progress-count">0 / 0</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="导出进度">
          <div id="progress-bar"></div>
        </div>
        <p id="current-item" class="current-item"></p>
        <p id="duplicate-summary" class="duplicate-summary hidden"></p>
        <p id="local-duplicate-summary" class="duplicate-summary hidden"></p>
        <details id="error-details" class="error-details hidden">
          <summary id="error-summary"></summary>
          <p id="error-message"></p>
        </details>
      </section>

      <footer class="action-bar">
        <div class="selection-copy">
          <span id="selection-label">已选择</span>
          <strong id="selected-count">0 门课程</strong>
        </div>
        <button id="back" class="secondary-button hidden" type="button">返回课程</button>
        <button id="export" class="primary-button" type="button" disabled>导出课件</button>
        <button id="cancel" class="secondary-button hidden" type="button">停止任务</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
